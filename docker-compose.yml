services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - DATA_DIR=/data
    volumes:
      - bot-data:/data
      - .:/app
    develop:
      watch:
        - action: restart
          path: .
          ignore:
            - venv/
            - __pycache__/
            - .git/

volumes:
  bot-data:
