name: CI/CD

# Build a Docker image on every push to main, publish it to GHCR, then deploy
# it to the VPS over SSH. Pull requests run lint only (no publish, no deploy).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # One deploy at a time; a newer push cancels an in-flight run on the branch.
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rss-feed

jobs:
  lint:
    name: Lint (PEP 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pycodestyle
      - name: pycodestyle (max-line-length from setup.cfg)
        run: pycodestyle bot.py db.py adapters cogs

  build-push:
    # Runs on PRs too — there it builds the image (no push) to catch a broken
    # Dockerfile before merge. On push to main it also publishes to GHCR.
    name: Build image (push to GHCR on main)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: img
        run: echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build always (verifies the Dockerfile on PRs); publish only on push.
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and roll the container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR || '~/rss-feed' }}
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
